<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lu-Ks Tienda</title>
<meta name="description" content="Caja, fiados, proveedores e inventario de tu tienda en el celular.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lu-Ks Tienda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EDF0F5;--sf:#fff;--sf2:#E3E8F0;--ink:#14213D;--mut:#5F6B80;--ac:#C2410C;--acink:#fff;--neg:#B4232C;--pos:#0F766E;--ln:#D5DCE7;--warn:#B45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1621;--sf:#16212F;--sf2:#1F2D40;--ink:#E6ECF5;--mut:#93A1B8;--ac:#FB923C;--acink:#2A1204;--neg:#FF8A8F;--pos:#3DD6C0;--ln:#26364C;--warn:#FBBF24;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:22px 0 10px}
.mut{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ac);text-transform:uppercase}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:var(--sf);display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--sf);border-radius:18px;padding:16px;margin-top:12px}
.sg{background:var(--sf);border-radius:18px;overflow:hidden;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600}
.s{font-size:13px;color:var(--mut)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}.warn{color:var(--warn)}
.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:var(--ac);color:var(--acink);font-weight:700;font-size:16px}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn.red{background:none;color:var(--neg)}
.btn:disabled{opacity:.6}
.lnk{border:0;background:none;color:var(--ac);font-weight:600;padding:4px 0}
.hero{background:var(--ac);color:var(--acink);border-radius:22px;padding:18px;margin-top:14px}
.hero .big{font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.hero .s{color:inherit;opacity:.8}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--sf);border-radius:16px;padding:12px 14px}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px;font-family:"Bricolage Grotesque",Figtree,sans-serif}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act{border:0;background:var(--sf);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.act span{font-size:24px}
.act.main{background:var(--ac);color:var(--acink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 6px;min-width:58px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav button[aria-current=true]{color:var(--ac)}
nav button[aria-current=true] span{filter:none;opacity:1}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acink)}
label{display:block;margin-top:12px;font-size:14px;color:var(--mut)}
.in{display:block;width:100%;margin-top:6px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:12px;font:16px Figtree,system-ui,sans-serif;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid var(--ac);outline-offset:-1px}
.money{font:800 34px "Bricolage Grotesque",Figtree,sans-serif;text-align:center;padding:10px}
.two{display:flex;gap:10px}
.two>label{align-self:flex-end}.two>*{flex:1;min-width:0}
.search{margin-top:12px}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:14px;line-height:1.5}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--sf2);color:var(--mut)}
.pill.w{background:rgba(180,83,9,.15);color:var(--warn)}
.pill.r{background:rgba(180,35,44,.14);color:var(--neg)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--ac);min-height:3px}
.bars small{font-size:10px;color:var(--mut)}
.prog{height:8px;border-radius:5px;background:var(--sf2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:5px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(5,10,20,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:41;max-width:600px;margin:0 auto}
#sh.on{transform:none}
#sh.kb{max-height:none;border-radius:20px 20px 0 0;transition:none}
.handle{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
#sh h1{font-size:21px;text-align:center}
.cart{margin-top:10px}
.cl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--sf2);font-size:18px;font-weight:700}
.plist{max-height:260px;overflow-y:auto;margin-top:8px;border-radius:14px;background:var(--sf)}
.pb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--ln);background:none;padding:11px 12px;text-align:left}
.pb:last-child{border:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.up{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
/* auth */
#auth{max-width:420px;margin:0 auto;padding:40px 20px}
#auth .logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin-top:16px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:8px}
.dif{font-size:15px;font-weight:700;text-align:center;margin-top:10px;padding:10px;border-radius:12px;background:var(--sf2)}
.hide{display:none!important}

/* v2 */
#snack{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:55;transform:translateY(220px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;font-weight:600;font-size:14px}
#snack.on{transform:none;opacity:1;pointer-events:auto}
#snack #snack-u{background:transparent;color:var(--bg);border:1.5px solid color-mix(in srgb,var(--bg) 45%,transparent);padding:8px 10px}
#snack button{border:0;background:var(--ac);color:var(--acink);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;white-space:nowrap}
#scan{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}
#scan.on{display:flex}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .frame{position:absolute;left:12%;right:12%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#scan .frame{transition:border-color .15s,box-shadow .15s}#scan .frame.ok{border-color:#22C55E;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 0 6px rgba(34,197,94,.55)}
#scan .bar{padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));background:#0E1621;color:#fff}
#scan .bar .in{background:#16212F;color:#fff;border-color:#26364C}
#scan .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;z-index:2}
#scan .hint{position:absolute;left:0;right:0;top:calc(32% - 44px);text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 4px #000}
.pkr{display:grid;grid-template-columns:1.25fr .8fr 1.15fr auto;gap:6px;align-items:start}.pkr label{margin-top:8px;font-size:12px}.pkr .in{margin-top:4px;padding-left:10px;padding-right:10px}
.wpan{background:var(--sf);border-radius:16px;padding:12px;margin-top:10px;border:2px solid var(--ac)}
.scanb{flex:none;width:48px;border:0;border-radius:12px;background:var(--sf2);font-size:22px;margin-top:12px}
.srch{display:flex;gap:8px}.srch .in{flex:1}
input[type=date].in{min-height:48px;line-height:22px}
.tag{font-size:12px;color:var(--mut)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--neg);color:#fff;font-size:12px;font-weight:700;margin-left:6px}
.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;padding:12px;background:var(--sf2);border-radius:12px;margin-top:10px;word-break:break-all}

#tsp{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);overflow:hidden;animation:tsOut .45s cubic-bezier(.4,0,.2,1) 2s forwards;cursor:pointer}
#tsp~#app,#tsp~#auth{visibility:hidden}
#tsp .ts-glow{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 24%,transparent) 0%,transparent 62%);opacity:0;transform:scale(.6);animation:tsGlow 1.4s cubic-bezier(.16,1,.3,1) .05s forwards}
#tsp .ts-in{position:relative;display:flex;flex-direction:column;align-items:center}
#tsp .ts-mark{width:92px;height:92px;opacity:0;transform:translateY(10px) scale(.86);animation:tsMark .7s cubic-bezier(.16,1,.3,1) .05s forwards;filter:drop-shadow(0 14px 30px color-mix(in srgb,var(--ac) 35%,transparent))}
#tsp svg{width:100%;height:100%;display:block;overflow:visible}
#tsp .ts-b{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transform:translateY(8px) scaleY(.7);animation:tsRise .5s cubic-bezier(.16,1,.3,1) .3s forwards}
#tsp .ts-a{transform-box:fill-box;transform-origin:50% 0;opacity:0;transform:translateY(-9px);animation:tsDrop .42s cubic-bezier(.16,1,.3,1) forwards}
#tsp .ts-a.a0{animation-delay:.5s}#tsp .ts-a.a1{animation-delay:.56s}#tsp .ts-a.a2{animation-delay:.62s}#tsp .ts-a.a3{animation-delay:.68s}#tsp .ts-bar{animation-delay:.45s}
#tsp .ts-w{opacity:0;animation:tsLight .5s ease-out .85s forwards}#tsp .ts-w.w2{animation-delay:.95s}
#tsp .ts-d{opacity:0;animation:tsFade .35s ease-out .75s forwards}
#tsp .ts-sw{fill:url(#tsSweep);transform:translateX(-110px);animation:tsSweep .9s cubic-bezier(.4,0,.2,1) 1.1s forwards}
#tsp .ts-logo{display:flex;align-items:baseline;margin-top:22px;font:800 42px/1 "Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.035em;color:var(--ink)}
#tsp .ts-logo span{display:inline-block;overflow:hidden;padding:0 .01em .06em}
#tsp .ts-logo i{display:inline-block;font-style:normal;transform:translateY(105%);animation:tsUp .6s cubic-bezier(.16,1,.3,1) forwards}
#tsp .ts-logo span:nth-child(1) i{animation-delay:.6s}#tsp .ts-logo span:nth-child(2) i{animation-delay:.68s;color:var(--ac);margin-left:.22em}
#tsp .ts-tag{margin-top:12px;font:500 13px Figtree,system-ui,sans-serif;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:tsTag .7s cubic-bezier(.16,1,.3,1) .95s forwards}
#tsp .ts-bar2{position:absolute;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:44px;height:3px;margin-left:-22px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;opacity:0;animation:tsFade .4s ease .3s forwards}
#tsp .ts-bar2 i{display:block;height:100%;width:100%;background:var(--ac);border-radius:2px;transform:translateX(-100%);animation:tsLoad 1.7s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes tsGlow{to{opacity:1;transform:scale(1)}}@keyframes tsMark{to{opacity:1;transform:none}}@keyframes tsRise{to{opacity:1;transform:none}}@keyframes tsDrop{to{opacity:1;transform:none}}
@keyframes tsLight{0%{opacity:0}60%{opacity:1;fill:#FFF3C4}100%{opacity:1}}@keyframes tsFade{to{opacity:1}}@keyframes tsSweep{to{transform:translateX(160px)}}@keyframes tsUp{to{transform:none}}
@keyframes tsTag{from{opacity:0;letter-spacing:.3em}to{opacity:1;letter-spacing:.14em}}@keyframes tsLoad{to{transform:none}}@keyframes tsOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#tsp,#tsp *{animation:none!important;opacity:1!important;transform:none!important}#tsp .ts-sw,#tsp .ts-bar2{display:none}}

/* ===== Diseño iOS 26 (vidrio) ===== */
:root{--bg:#F2F2F7;--sf:#FFFFFF;--sf2:rgba(118,118,128,.12);--ink:#000;--mut:rgba(60,60,67,.6);--ac:#007AFF;--acink:#fff;--neg:#FF3B30;--pos:#248A3D;--ln:rgba(60,60,67,.16);--warn:#C93400;--glass:rgba(250,250,252,.78);--glassb:rgba(255,255,255,.75);--sheet:rgba(242,242,247,.86);--shadow:0 10px 34px rgba(0,0,0,.12);--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sf:#1C1C1E;--sf2:rgba(118,118,128,.24);--ink:#fff;--mut:rgba(235,235,245,.6);--ac:#0A84FF;--acink:#fff;--neg:#FF453A;--pos:#30D158;--ln:rgba(84,84,88,.5);--warn:#FF9F0A;--glass:rgba(36,36,38,.78);--glassb:rgba(255,255,255,.12);--sheet:rgba(28,28,30,.88);--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--sf:#1C1C1E;--sf2:rgba(118,118,128,.24);--ink:#fff;--mut:rgba(235,235,245,.6);--ac:#0A84FF;--acink:#fff;--neg:#FF453A;--pos:#30D158;--ln:rgba(84,84,88,.5);--warn:#FF9F0A;--glass:rgba(36,36,38,.78);--glassb:rgba(255,255,255,.12);--sheet:rgba(28,28,30,.88);--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark}
html,body{font-family:var(--f);font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,.big,.kpi .v,.money,#tsp .ts-logo{font-family:var(--f)!important}
h1{font-size:28px;font-weight:700;letter-spacing:.005em;line-height:1.15}
h2{font-size:20px;font-weight:700;letter-spacing:.01em;margin:24px 4px 8px}
.brand{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--mut)}
.circ{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:.5px solid var(--glassb);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card,.sg,.kpi,.plist{border-radius:24px}
.card{padding:16px 18px}
.row{border-bottom:.5px solid var(--ln);padding:12px 16px;min-height:58px}
.ic{border-radius:12px;width:40px;height:40px}
.t{font-weight:600}
.s{font-size:14px}
.btn{border-radius:999px;padding:15px 18px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.btn.ghost{background:var(--sf2);color:var(--ac)}
.btn.red{color:var(--neg)}
.lnk{color:var(--ac);font-weight:500}
.hero{background:linear-gradient(135deg,#0A84FF 0%,#0060DF 55%,#5E5CE6 120%);color:#fff;border-radius:28px;padding:20px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,96,223,.28)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);pointer-events:none;border-radius:inherit}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em}
.kpi{padding:14px 16px}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.01em}
.acts{gap:10px}
.act{border-radius:22px;padding:14px 4px 12px;font-size:13px;font-weight:600}
.act.main{background:var(--ac);color:#fff}
nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;border-radius:32px;border:.5px solid var(--glassb);background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow);padding:6px}
nav button{border-radius:26px;padding:6px 4px;min-width:0;flex:1;font-size:10.5px;font-weight:600;transition:background .2s}
nav button[aria-current=true]{background:var(--sf2);color:var(--ac)}
.wrap{padding-bottom:130px}
.seg{border-radius:999px;background:var(--sf2);padding:3px}
.seg button{border-radius:999px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--sf);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.chips{gap:6px}.chip{border:0;background:var(--sf2);border-radius:999px;padding:8px 11px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ac);color:#fff}
label{font-size:13px;color:var(--mut);margin-top:14px;padding-left:4px}
label .in,label input,label select{letter-spacing:-.01em}
.in{border:0;background:var(--sf2);border-radius:14px;padding:13px 14px;font:17px var(--f)}
.in:focus{outline:2px solid var(--ac);outline-offset:0}
