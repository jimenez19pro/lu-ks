<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lu-Ks Tienda</title>
<meta name="description" content="Caja, fiados, proveedores e inventario de tu tienda en el celular.">
<meta name="theme-color" content="#0E1621">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lu-Ks Tienda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EDF0F5;--sf:#fff;--sf2:#E3E8F0;--ink:#14213D;--mut:#5F6B80;--ac:#C2410C;--acink:#fff;--neg:#B4232C;--pos:#0F766E;--ln:#D5DCE7;--warn:#B45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1621;--sf:#16212F;--sf2:#1F2D40;--ink:#E6ECF5;--mut:#93A1B8;--ac:#FB923C;--acink:#2A1204;--neg:#FF8A8F;--pos:#3DD6C0;--ln:#26364C;--warn:#FBBF24;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:22px 0 10px}
.mut{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ac);text-transform:uppercase}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:var(--sf);display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--sf);border-radius:18px;padding:16px;margin-top:12px}
.sg{background:var(--sf);border-radius:18px;overflow:hidden;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:13px;background:var(--sf2);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600}
.s{font-size:13px;color:var(--mut)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}.warn{color:var(--warn)}
.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:var(--ac);color:var(--acink);font-weight:700;font-size:16px}
.btn.ghost{background:var(--sf2);color:var(--ink)}
.btn.red{background:none;color:var(--neg)}
.btn:disabled{opacity:.6}
.lnk{border:0;background:none;color:var(--ac);font-weight:600;padding:4px 0}
.hero{background:var(--ac);color:var(--acink);border-radius:22px;padding:18px;margin-top:14px}
.hero .big{font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.hero .s{color:inherit;opacity:.8}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--sf);border-radius:16px;padding:12px 14px}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px;font-family:"Bricolage Grotesque",Figtree,sans-serif}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act{border:0;background:var(--sf);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.act span{font-size:24px}
.act.main{background:var(--ac);color:var(--acink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 6px;min-width:58px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav button[aria-current=true]{color:var(--ac)}
nav button[aria-current=true] span{filter:none;opacity:1}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acink)}
label{display:block;margin-top:12px;font-size:14px;color:var(--mut)}
.in{display:block;width:100%;margin-top:6px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:12px;font:16px Figtree,system-ui,sans-serif;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid var(--ac);outline-offset:-1px}
.money{font:800 34px "Bricolage Grotesque",Figtree,sans-serif;text-align:center;padding:10px}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.search{margin-top:12px}
.empty{text-align:center;padding:26px 16px;color:var(--mut);font-size:14px;line-height:1.5}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--sf2);color:var(--mut)}
.pill.w{background:rgba(180,83,9,.15);color:var(--warn)}
.pill.r{background:rgba(180,35,44,.14);color:var(--neg)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--ac);min-height:3px}
.bars small{font-size:10px;color:var(--mut)}
.prog{height:8px;border-radius:5px;background:var(--sf2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:5px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(5,10,20,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:41;max-width:600px;margin:0 auto}
#sh.on{transform:none}
.handle{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
#sh h1{font-size:21px;text-align:center}
.cart{margin-top:10px}
.cl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--sf2);font-size:18px;font-weight:700}
.plist{max-height:260px;overflow-y:auto;margin-top:8px;border-radius:14px;background:var(--sf)}
.pb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--ln);background:none;padding:11px 12px;text-align:left}
.pb:last-child{border:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* auth */
#auth{max-width:420px;margin:0 auto;padding:40px 20px}
#auth .logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin-top:16px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:8px}
.dif{font-size:15px;font-weight:700;text-align:center;margin-top:10px;padding:10px;border-radius:12px;background:var(--sf2)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="auth" class="hide"></div>
<div id="app" class="hide"><div class="wrap" id="main"></div>
<nav id="nav">
<button data-tab="caja" aria-current="true"><span>💵</span>Caja</button>
<button data-tab="fiados"><span>📒</span>Fiados</button>
<button data-tab="inv"><span>📦</span>Inventario</button>
<button data-tab="gastos"><span>🧾</span>Gastos</button>
<button data-tab="rep"><span>📊</span>Reportes</button>
</nav></div>
<div id="ov"></div><div id="sh"></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function m(n){n=Math.round(+n||0);return(n<0?"-$":"$")+Math.abs(n).toLocaleString("es-CO")}
function num(s){return +(String(s||"").replace(/\D/g,""))||0}
function pad(n){return("0"+n).slice(-2)}
function iso(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=String(s||"").split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function fd(s){return pd(s).toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"})}
function hr(ts){var d=new Date(ts);return d.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"})}
function uid8(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function nz(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function open(h){$("#sh").innerHTML='<div class="handle"></div>'+h;$("#sh").scrollTop=0;$("#sh").classList.add("on");$("#ov").classList.add("on")}
function close(){$("#sh").classList.remove("on");$("#ov").classList.remove("on");SH=null}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function fmtIn(e){var d=num(e.value);e.value=d?m(d):""}
var MET={ef:"Efectivo",tr:"Transferencia",fi:"Fiado"};
var GCAT=[["merc","🛒","Mercancía"],["serv","💡","Servicios"],["arr","🏠","Arriendo"],["emp","👷","Empleados"],["trans","🛵","Transporte"],["otro","📌","Otros"]];
function gcat(k){for(var i=0;i<GCAT.length;i++)if(GCAT[i][0]===k)return GCAT[i];return GCAT[GCAT.length-1]}

/* ---------- firebase ---------- */
if(!window.LUKS_FB){document.body.innerHTML='<p style="padding:30px;text-align:center">No se encontró la configuración.</p>';return}
firebase.initializeApp(window.LUKS_FB);
var auth=firebase.auth(),db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
var COLS=["prod","venta","cli","fmov","gasto","prov","pmov","caja","conf"];
var D={},UID=null,UNS=[],READY={};
COLS.forEach(function(k){D[k]=[]});
function col(k){return db.collection("users").doc(UID).collection("t_"+k)}
function sid(d){return String(d.id).split("/").pop()}
function listen(){UNS.forEach(function(u){try{u()}catch(e){}});UNS=[];READY={};COLS.forEach(function(k){D[k]=[];UNS.push(col(k).onSnapshot({includeMetadataChanges:false},function(s){D[k]=s.docs.map(function(d){var v=d.data()||{};v.id=sid(d);return v});READY[k]=1;if(!SH)draw();else if(SH.live)SH.live()},function(e){READY[k]=1;console.error(e)}))})}
function put(k,o){if(!o.id)o.id=uid8();if(!o.ts)o.ts=Date.now();var a=D[k],i=a.findIndex(function(x){return x.id===o.id});if(i>=0)a[i]=o;else a.push(o);var b=db.batch();b.set(col(k).doc(o.id),JSON.parse(JSON.stringify(o)));b.commit().catch(function(e){console.error(e)});return o}
function del(k,id){D[k]=D[k].filter(function(x){return x.id!==id});var b=db.batch();b.delete(col(k).doc(id));b.commit().catch(function(){})}
function conf(){var c=D.conf.filter(function(x){return x.id==="conf"})[0]||{};return{id:"conf",tienda:c.tienda||"",base:c.base!=null?+c.base:0,margen:c.margen!=null?+c.margen:20,ts:c.ts}}
function byId(k,id){for(var i=0;i<D[k].length;i++)if(D[k][i].id===id)return D[k][i];return null}

/* ---------- cálculos ---------- */
function inR(x,a,b){return x.fecha>=a&&x.fecha<=b}
function cajaDia(f){return D.caja.filter(function(c){return c.id===f})[0]||null}
function resumen(a,b){var c=conf(),r={ventas:0,n:0,costo:0,ef:0,tr:0,fi:0,gastos:0,gEf:0,abonos:0,abEf:0,pagosProv:0,ppEf:0,gOp:0};D.venta.forEach(function(v){if(!inR(v,a,b))return;r.ventas+=v.total;r.n++;r.costo+=v.costo!=null?v.costo:v.total*(1-c.margen/100);r[v.metodo]=(r[v.metodo]||0)+v.total});D.gasto.forEach(function(g){if(!inR(g,a,b))return;r.gastos+=g.monto;if(g.metodo==="ef")r.gEf+=g.monto;if(g.cat!=="merc")r.gOp+=g.monto});D.fmov.forEach(function(x){if(x.tipo!=="abono"||!inR(x,a,b))return;r.abonos+=x.monto;if(x.metodo==="ef")r.abEf+=x.monto});D.pmov.forEach(function(x){if(x.tipo!=="pago"||!inR(x,a,b))return;r.pagosProv+=x.monto;if(x.metodo==="ef")r.ppEf+=x.monto});r.ganancia=r.ventas-r.costo-r.gOp;return r}
function esperado(f){var c=cajaDia(f),base=c&&c.base!=null?+c.base:conf().base,r=resumen(f,f);return{base:base,r:r,total:base+r.ef+r.abEf-r.gEf-r.ppEf}}
function saldoCli(id){var s=0;D.fmov.forEach(function(x){if(x.cli===id)s+=x.tipo==="cargo"?x.monto:-x.monto});return s}
function saldoProv(id){var s=0;D.pmov.forEach(function(x){if(x.prov===id)s+=x.tipo==="compra"?x.monto:-x.monto});return s}
function porCobrar(){return D.cli.reduce(function(s,c){return s+Math.max(0,saldoCli(c.id))},0)}
function porPagar(){return D.prov.reduce(function(s,p){return s+Math.max(0,saldoProv(p.id))},0)}
function bajos(){return D.prod.filter(function(p){return(+p.min||0)>0&&(+p.st||0)<=(+p.min||0)})}
function ultMov(id){var t=0;D.fmov.forEach(function(x){if(x.cli===id&&x.ts>t)t=x.ts});return t}

/* ---------- estado ---------- */
var TAB="caja",SH=null,GV="gastos",RP="hoy",Q="",QF="";
try{TAB=localStorage.getItem("lkt-tab")||"caja"}catch(e){}

/* ---------- pantallas ---------- */
function header(t,sub){var c=conf();return'<div class="top"><div class="grow"><div class="brand">Lu-Ks Tienda'+(c.tienda?' · '+esc(c.tienda):'')+'</div><h1>'+t+'</h1>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div><button class="circ" data-a="ajustes" aria-label="Ajustes">⚙️</button></div>'}
function vCaja(){var f=iso(),e=esperado(f),r=e.r,c=cajaDia(f),bj=bajos(),h=header(saludo(),fd(f));
if(!conf().tienda&&!D.prod.length&&!D.venta.length)h+='<div class="card" style="border:1px solid var(--ac)"><div class="t">👋 Bienvenido a Lu-Ks Tienda</div><div class="s" style="margin-top:4px">Empieza poniéndole nombre a tu tienda y la plata con la que abres la caja.</div><button class="btn" data-a="ajustes">Configurar mi tienda</button></div>';
h+='<div class="hero"><div class="s">Ventas de hoy</div><div class="big">'+m(r.ventas)+'</div><div class="s" style="margin-top:4px">'+r.n+(r.n===1?' venta':' ventas')+(r.n?' · ticket promedio '+m(r.ventas/r.n):'')+'</div></div>';
h+='<div class="acts"><button class="act main" data-a="venta"><span>➕</span>Venta</button><button class="act" data-a="fiar"><span>📒</span>Fiar</button><button class="act" data-a="gasto"><span>💸</span>Gasto</button><button class="act" data-a="cierre"><span>🔒</span>'+(c&&c.contado!=null?'Caja':'Cerrar')+'</button></div>';
h+='<div class="kpis"><div class="kpi"><div class="s">💵 En caja (esperado)</div><div class="v">'+m(e.total)+'</div></div><div class="kpi"><div class="s">📈 Ganancia estimada</div><div class="v '+(r.ganancia<0?'neg':'pos')+'">'+m(r.ganancia)+'</div></div><div class="kpi"><div class="s">📱 Transferencias</div><div class="v">'+m(r.tr)+'</div></div><div class="kpi"><div class="s">📒 Fiado hoy</div><div class="v">'+m(r.fi)+'</div></div></div>';
if(c&&c.contado!=null)h+='<div class="card"><div class="t">🔒 Caja cerrada a las '+hr(c.cerrado)+'</div><div class="s">Contaste '+m(c.contado)+' · '+difTxt(c.contado-c.esperado)+'</div></div>';
if(bj.length)h+='<button class="card" data-tab="inv" data-f="bajo" style="display:block;width:100%;border:0;text-align:left"><div class="t warn">⚠️ '+bj.length+(bj.length===1?' producto se está acabando':' productos se están acabando')+'</div><div class="s ell">'+esc(bj.slice(0,4).map(function(p){return p.n}).join(", "))+'</div></button>';
var pc=porCobrar();if(pc>0)h+='<button class="card" data-tab="fiados" style="display:block;width:100%;border:0;text-align:left"><div class="s">Te deben en fiados</div><div class="t" style="font-size:18px">'+m(pc)+'</div></button>';
var hoyV=D.venta.filter(function(v){return v.fecha===f}).sort(function(a,b){return b.ts-a.ts});
var hoyG=D.gasto.filter(function(g){return g.fecha===f});
var hoyA=D.fmov.filter(function(x){return x.fecha===f&&x.tipo==="abono"});
var mov=hoyV.map(function(v){return{ts:v.ts,h:'<button class="row" data-a="verVenta" data-id="'+v.id+'"><div class="ic">'+(v.metodo==="fi"?"📒":v.metodo==="tr"?"📱":"💵")+'</div><div class="grow"><div class="t ell">'+esc(vDesc(v))+'</div><div class="s">'+hr(v.ts)+' · '+MET[v.metodo]+(v.metodo==="fi"&&byId("cli",v.cli)?' · '+esc(byId("cli",v.cli).n):'')+'</div></div><div class="amt pos">+'+m(v.total)+'</div></button>'}}).concat(hoyG.map(function(g){var c2=gcat(g.cat);return{ts:g.ts,h:'<button class="row" data-a="verGasto" data-id="'+g.id+'"><div class="ic">'+c2[1]+'</div><div class="grow"><div class="t ell">'+esc(g.nota||c2[2])+'</div><div class="s">'+hr(g.ts)+' · '+c2[2]+' · '+MET[g.metodo]+'</div></div><div class="amt neg">-'+m(g.monto)+'</div></button>'}})).concat(hoyA.map(function(x){var cl=byId("cli",x.cli);return{ts:x.ts,h:'<button class="row" data-a="cli" data-id="'+x.cli+'"><div class="ic">🤝</div><div class="grow"><div class="t ell">Abono de '+esc(cl?cl.n:"cliente")+'</div><div class="s">'+hr(x.ts)+' · '+MET[x.metodo]+'</div></div><div class="amt pos">+'+m(x.monto)+'</div></button>'}})).sort(function(a,b){return b.ts-a.ts});
